[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "ccdiff-undergraduate-tutorials"
version = "1.0.0"
description = "Biology-first practical pathway to understanding the CCDiff research paper"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "matplotlib>=3.6", "scikit-learn>=1.2", "scipy>=1.10", "Pillow>=9"]
[project.optional-dependencies]
notebooks = ["jupyterlab>=4", "nbformat>=5", "nbclient>=0.8", "ipykernel>=6"]
test = ["pytest>=7", "nbformat>=5", "nbclient>=0.8", "ipykernel>=6"]
[tool.setuptools.packages.find]
where = ["src"]
